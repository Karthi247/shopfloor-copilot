services:
  backend:
    image: ${DOCKERHUB_USERNAME:-local}/shopfloor-ai-copilot-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      CHROMA_PATH: backend/data/chroma_db
      DOCUMENTS_PATH: data/Documents
      AUTH_DATABASE_PATH: backend/data/users.sqlite3
      HF_HOME: /home/app/.cache/huggingface
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/data:/app/backend/data
      - huggingface-cache:/home/app/.cache/huggingface
      - ./data/Documents:/app/data/Documents:ro
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/shopfloor-ai-copilot-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  huggingface-cache:
